<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Flat Dark Navy Background (#101B26) -->
  <rect width="512" height="512" rx="112" fill="#101B26"/>
  <!-- 4 Document Text Lines (#DEEAF4) -->
  <g stroke="#DEEAF4" stroke-width="24" stroke-linecap="round">
    <line x1="104" y1="138" x2="368" y2="138"/>
    <line x1="104" y1="202" x2="292" y2="202"/>
    <line x1="104" y1="266" x2="218" y2="266"/>
    <line x1="104" y1="330" x2="206" y2="330"/>
  </g>
  <!-- Mint Green Magnifying Glass (#64DCC7) -->
  <circle cx="318" cy="296" r="88" fill="#101B26" stroke="#64DCC7" stroke-width="24"/>
  <!-- 3 Refined Lines Inside Lens (#64DCC7) -->
  <g stroke="#64DCC7" stroke-width="18" stroke-linecap="round">
    <line x1="274" y1="266" x2="358" y2="266"/>
    <line x1="274" y1="296" x2="344" y2="296"/>
    <line x1="274" y1="326" x2="326" y2="326"/>
  </g>
  <!-- Magnifying Glass Handle (#64DCC7) -->
  <line x1="382" y1="360" x2="430" y2="408" stroke="#64DCC7" stroke-width="28" stroke-linecap="round"/>
</svg>
